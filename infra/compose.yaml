name: sonosmonitoring-dev

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      POSTGRES_DB: sonosmonitoring_dev
      POSTGRES_USER: sonosmonitoring_dev
      POSTGRES_PASSWORD: ${SONOSMONITORING_DEV_POSTGRES_PASSWORD:?Run scripts/start-backend.ps1 to create local credentials}
    ports:
      - "127.0.0.1:48432:5432"
    volumes:
      - sonosmonitoring-dev-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonosmonitoring_dev -d sonosmonitoring_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    hostname: ${SONOSMONITORING_DEV_RABBITMQ_HOSTNAME:?Run scripts/start-backend.ps1 to preserve the broker identity}
    image: rabbitmq:4.1.8-management@sha256:3574a8edaca320282b9c848f0b2661566b7e74f52c1b590f401b10224d294642
    environment:
      RABBITMQ_DEFAULT_USER: sonosmonitoring_dev
      RABBITMQ_DEFAULT_PASS: ${SONOSMONITORING_DEV_RABBITMQ_PASSWORD:?Run scripts/start-backend.ps1 to create local credentials}
    ports:
      - "127.0.0.1:48672:5672"
    volumes:
      - sonosmonitoring-dev-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5672"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo:
    image: mongo:8.0.30-noble@sha256:f40b97b97ce805c48ab428ce4422180ae0ef0de6dacadf1e32c6e6a1cbc9353d
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:48017:27017"
    volumes:
      - sonosmonitoring-dev-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  sonosmonitoring-dev-postgres-data:
    name: sonosmonitoring-dev-postgres-data
  sonosmonitoring-dev-rabbitmq-data:
    name: sonosmonitoring-dev-rabbitmq-data
  sonosmonitoring-dev-mongo-data:
    name: sonosmonitoring-dev-mongo-data
