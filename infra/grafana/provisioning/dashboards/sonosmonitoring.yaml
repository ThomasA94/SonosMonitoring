apiVersion: 1

providers:
  - name: SonosMonitoring
    orgId: 1
    folder: SonosMonitoring
    type: file
    disableDeletion: true
    allowUiUpdates: false
    # Docker bind mounts can omit filesystem notifications; values above 10 force polling.
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
